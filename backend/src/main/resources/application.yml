spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${SPRING_DATASOURCE_USERNAME:wallet}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet}
  sql:
    init:
      mode: always
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-message: never
wallet:
  tokens: ${WALLET_TOKENS:alice-token:alice,bob-token:bob}
management:
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.99
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: wallet-api
